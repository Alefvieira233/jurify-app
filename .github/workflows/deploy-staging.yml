name: 🧪 Deploy to Staging
# ⚠️ WARNING: Staging currently shares the PRODUCTION Supabase database.
# TODO: Create separate Supabase project for staging to prevent data corruption.

on:
  push:
    branches: [develop]
    paths:
      - 'src/**'
      - 'supabase/**'
      - 'package.json'
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  WORKING_DIR: '.'

jobs:
  # ==========================================
  # JOB 0: PRE-DEPLOY GATE
  # ==========================================
  pre-deploy-gate:
    name: 🛡️ Pre-Deploy Readiness Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: 📦 Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: 🛡️ Validate secrets config
        run: node scripts/validate-secrets.cjs --ci

      - name: 🔍 Type check
        run: npm run type-check

      - name: 🧪 Run unit tests
        run: npm test -- --run
        env:
          CI: true
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

  # ==========================================
  # JOB 1: DEPLOY FRONTEND (Preview)
  # ==========================================
  deploy-frontend:
    name: 🌐 Deploy Frontend to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: pre-deploy-gate
    environment:
      name: staging

    outputs:
      preview-url: ${{ steps.deploy.outputs.preview-url }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: 📦 Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: 🏗️ Build staging
        run: npm run build
        env:
          NODE_ENV: production
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_APP_VERSION: ${{ github.sha }}

      - name: 🚀 Deploy to Vercel (Preview)
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          # No --prod flag = preview deployment

  # ==========================================
  # JOB 2: DEPLOY SUPABASE EDGE FUNCTIONS
  # ==========================================
  deploy-edge-functions:
    name: ⚡ Deploy Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Validate required secrets
        run: |
          MISSING=""
          [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ] && MISSING="$MISSING SUPABASE_ACCESS_TOKEN"
          [ -z "${{ secrets.SUPABASE_PROJECT_REF }}" ] && MISSING="$MISSING SUPABASE_PROJECT_REF"
          if [ -n "$MISSING" ]; then
            echo "❌ Missing required secrets:$MISSING"
            exit 1
          fi
          echo "✅ All required secrets present"

      - name: 🟢 Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: 📦 Install Supabase CLI
        run: |
          curl -fsSL https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz | tar -xz -C /tmp
          sudo mv /tmp/supabase /usr/local/bin/

      - name: 🔗 Link Supabase project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: ⚡ Deploy Edge Functions
        run: |
          echo "🚀 Deploying edge functions..."
          # Full list — synced with supabase/functions/ on 2026-04-03
          # Functions públicas (sem JWT): health, health-check, stripe-webhook, whatsapp-webhook, zapsign-integration
          supabase functions deploy health --no-verify-jwt
          supabase functions deploy health-check --no-verify-jwt
          supabase functions deploy stripe-webhook --no-verify-jwt
          supabase functions deploy whatsapp-webhook --no-verify-jwt
          supabase functions deploy zapsign-integration --no-verify-jwt
          # Functions que requerem JWT (deploy padrão — com auth)
          for fn in admin-create-user agentes-ia-api agent-orchestrator \
                    ai-agent-processor assistant auto-followup \
                    chat-completion cleanup-agent-memory \
                    create-checkout-session create-drive-folder \
                    create-portal-session data-retention-cleanup \
                    decrypt-data encrypt-data extract-document-text \
                    generate-document generate-embedding google-calendar \
                    ingest-document ingest-document-from-file \
                    kapso-manager media-processor process-followup-queue \
                    process-prazos-alerts send-email send-push-notification \
                    send-whatsapp-message vector-search weekly-report; do
            supabase functions deploy "$fn" 2>/dev/null || echo "⚠️ $fn: não encontrada, pulando"
          done
          echo "✅ Edge functions deployed"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  # ==========================================
  # JOB 3: RUN DATABASE MIGRATIONS
  # ==========================================
  deploy-migrations:
    name: 🗄️ Run Database Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Install Supabase CLI
        run: |
          curl -fsSL https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz | tar -xz -C /tmp
          sudo mv /tmp/supabase /usr/local/bin/

      - name: 🔗 Link Supabase project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: 🗄️ Run migrations
        run: |
          echo "🗄️ Checking for pending migrations..."
          supabase db push --dry-run
          echo "🗄️ Applying migrations..."
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  # ==========================================
  # JOB 4: SMOKE TESTS
  # ==========================================
  smoke-tests:
    name: 💨 Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [deploy-frontend, deploy-edge-functions]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🔍 Health check - Frontend (Preview)
        run: |
          PREVIEW_URL="${{ needs.deploy-frontend.outputs.preview-url }}"
          if [ -z "$PREVIEW_URL" ]; then
            echo "⚠️ No preview URL available, skipping frontend health check"
            exit 0
          fi
          echo "🔍 Checking staging frontend at $PREVIEW_URL..."
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$PREVIEW_URL" || echo "000")
            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
              echo "✅ Frontend OK (HTTP $STATUS)"
              exit 0
            fi
            echo "⚠️ Attempt $i: HTTP $STATUS — retrying in 10s..."
            sleep 10
          done
          echo "❌ Frontend health check failed after 3 attempts"
          exit 1

      - name: 🔍 Health check - Edge Functions
        run: |
          echo "🔍 Checking edge functions..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            "${{ secrets.VITE_SUPABASE_URL }}/functions/v1/health-check" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}" || echo "000")
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "✅ Edge Functions OK (HTTP $STATUS)"
          else
            echo "❌ Edge Functions health check failed (HTTP $STATUS)"
            exit 1
          fi

      - name: 📊 Report staging deployment
        run: |
          echo "## 🧪 Staging Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | Deployed (Preview) |" >> $GITHUB_STEP_SUMMARY
          echo "| Edge Functions | Deployed |" >> $GITHUB_STEP_SUMMARY
          echo "| Migrations | Applied |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Preview URL:** ${{ needs.deploy-frontend.outputs.preview-url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Author:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
