# Deploy hotfix das edge functions a partir da branch de auditoria.
# Criado em 2026-07-19: o workflow_dispatch de deploy-production.yml não está
# acessível via API para a integração, e os fixes P0 precisam chegar em produção.
# Escopo mínimo: só as 4 functions tocadas pela auditoria 2026-07-19.
name: 🚑 Deploy Functions (branch hotfix)

on:
  push:
    branches: [claude/jurify-saas-analysis-lbp83v]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-functions-branch.yml'
  workflow_dispatch:

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Install Supabase CLI
        run: |
          curl -fsSL https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz | tar -xz -C /tmp
          sudo mv /tmp/supabase /usr/local/bin/

      - name: 🔗 Link project
        run: supabase link --project-ref yfxgncbopvnsltjqetxw
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: ⚡ Deploy functions da auditoria 2026-07-19
        run: |
          supabase functions deploy whatsapp-webhook --no-verify-jwt
          supabase functions deploy send-whatsapp-message
          supabase functions deploy process-prazos-alerts
          supabase functions deploy meta-manager
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
