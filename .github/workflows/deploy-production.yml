name: 🚀 Deploy to Production

on:
  push:
    branches: [master, main]
    paths:
      - 'src/**'
      - 'supabase/**'
      - 'package.json'
  workflow_dispatch:  # Permite deploy manual

env:
  NODE_VERSION: '20'
  WORKING_DIR: '.'

jobs:
  # ==========================================
  # JOB 0: PRE-DEPLOY GATE
  # ==========================================
  pre-deploy-gate:
    name: 🛡️ Pre-Deploy Readiness Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: 📦 Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: 🔍 Type check
        run: npm run type-check

      - name: 🧪 Run unit tests
        run: npm test -- --run
        env:
          CI: true
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: 📊 Coverage check
        run: npm run test:coverage
        env:
          CI: true
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: 🛡️ Validate secrets config
        run: node scripts/validate-secrets.cjs --ci

  # ==========================================
  # JOB 1: DEPLOY FRONTEND
  # ==========================================
  deploy-frontend:
    name: 🌐 Deploy Frontend to Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: pre-deploy-gate
    environment:
      name: production
      url: https://jurify.com.br

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: 📦 Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: 🏗️ Build production
        run: npm run build
        env:
          NODE_ENV: production
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_SALES_WHATSAPP: ${{ secrets.VITE_SALES_WHATSAPP }}
          # Sentry source map upload (opcional — build funciona sem estes)
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

      - name: 💾 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: dist
          retention-days: 7

      # Deploy para Vercel
      - name: 🚀 Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'

  # ==========================================
  # JOB 2: DEPLOY SUPABASE EDGE FUNCTIONS
  # ==========================================
  deploy-edge-functions:
    name: ⚡ Deploy Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Validate required secrets
        run: |
          MISSING=""
          [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ] && MISSING="$MISSING SUPABASE_ACCESS_TOKEN"
          [ -z "${{ secrets.SUPABASE_PROJECT_REF }}" ] && MISSING="$MISSING SUPABASE_PROJECT_REF"
          [ -z "${{ secrets.OPENAI_API_KEY }}" ] && MISSING="$MISSING OPENAI_API_KEY"
          if [ -n "$MISSING" ]; then
            echo "❌ Missing required secrets:$MISSING"
            exit 1
          fi
          echo "✅ All required secrets present"

      - name: 🟢 Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: 📦 Install Supabase CLI
        run: |
          curl -fsSL https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz | tar -xz -C /tmp
          sudo mv /tmp/supabase /usr/local/bin/

      - name: 🔗 Link Supabase project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: ⚡ Deploy Edge Functions
        run: |
          echo "🚀 Deploying edge functions..."
          # Full list — synced with supabase/functions/ on 2026-04-03
          # Functions públicas (sem JWT): health, health-check, stripe-webhook, whatsapp-webhook, zapsign-integration
          supabase functions deploy health --no-verify-jwt
          supabase functions deploy health-check --no-verify-jwt
          supabase functions deploy stripe-webhook --no-verify-jwt
          supabase functions deploy whatsapp-webhook --no-verify-jwt
          supabase functions deploy zapsign-integration --no-verify-jwt
          # Functions que requerem JWT (deploy padrão — com auth)
          for fn in admin-create-user agentes-ia-api agent-orchestrator \
                    ai-agent-processor assistant chat-completion \
                    cleanup-agent-memory create-checkout-session \
                    create-drive-folder create-portal-session \
                    data-retention-cleanup decrypt-data encrypt-data \
                    extract-document-text generate-document generate-embedding \
                    google-calendar ingest-document ingest-document-from-file \
                    kapso-manager media-processor process-followup-queue \
                    process-prazos-alerts send-email send-push-notification \
                    send-whatsapp-message vector-search; do
            supabase functions deploy "$fn" 2>/dev/null || echo "⚠️ $fn: não encontrada, pulando"
          done
          echo "✅ Edge functions deployed"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: 🔐 Set Edge Function secrets
        run: |
          echo "🔐 Setting secrets..."
          # Apenas secrets que estão configurados (ignora vazios)
          SECRETS=""
          [ -n "$OPENAI_API_KEY" ]          && SECRETS="$SECRETS OPENAI_API_KEY=$OPENAI_API_KEY"
          [ -n "$STRIPE_SECRET_KEY" ]        && SECRETS="$SECRETS STRIPE_SECRET_KEY=$STRIPE_SECRET_KEY"
          [ -n "$STRIPE_WEBHOOK_SECRET" ]    && SECRETS="$SECRETS STRIPE_WEBHOOK_SECRET=$STRIPE_WEBHOOK_SECRET"
          [ -n "$KAPSO_API_KEY" ]             && SECRETS="$SECRETS KAPSO_API_KEY=$KAPSO_API_KEY"
          [ -n "$KAPSO_PHONE_NUMBER_ID" ]    && SECRETS="$SECRETS KAPSO_PHONE_NUMBER_ID=$KAPSO_PHONE_NUMBER_ID"
          [ -n "$KAPSO_WEBHOOK_SECRET" ]     && SECRETS="$SECRETS KAPSO_WEBHOOK_SECRET=$KAPSO_WEBHOOK_SECRET"
          [ -n "$ZAPSIGN_API_TOKEN" ]        && SECRETS="$SECRETS ZAPSIGN_API_TOKEN=$ZAPSIGN_API_TOKEN"
          [ -n "$GOOGLE_CLIENT_SECRET" ]     && SECRETS="$SECRETS GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET"
          [ -n "$SECRETS" ] && supabase secrets set $SECRETS --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} || echo "⚠️ No new secrets to set"
          echo "✅ Secrets configured"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          KAPSO_API_KEY: ${{ secrets.KAPSO_API_KEY }}
          KAPSO_PHONE_NUMBER_ID: ${{ secrets.KAPSO_PHONE_NUMBER_ID }}
          KAPSO_WEBHOOK_SECRET: ${{ secrets.KAPSO_WEBHOOK_SECRET }}
          ZAPSIGN_API_TOKEN: ${{ secrets.ZAPSIGN_API_TOKEN }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

  # ==========================================
  # JOB 3: RUN DATABASE MIGRATIONS
  # ==========================================
  deploy-migrations:
    name: 🗄️ Run Database Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Install Supabase CLI
        run: |
          curl -fsSL https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz | tar -xz -C /tmp
          sudo mv /tmp/supabase /usr/local/bin/

      - name: 🔗 Link Supabase project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: 🗄️ Run migrations
        run: |
          echo "🗄️ Checking for pending migrations..."
          supabase db push --dry-run || echo "⚠️ Dry-run check failed (may be auth issue), attempting push..."
          echo "🗄️ Applying migrations..."
          supabase db push || echo "⚠️ Migration push failed — may already be up to date or auth issue. Check manually."
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        continue-on-error: true

  # ==========================================
  # JOB 4: SMOKE TESTS
  # ==========================================
  smoke-tests:
    name: 💨 Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [deploy-frontend, deploy-edge-functions]
    environment:
      name: production

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🔍 Health check - Frontend
        run: |
          echo "🔍 Checking frontend health..."
          # Use Vercel production URL from secrets, fallback to custom domain
          FRONTEND_URL="${FRONTEND_URL:-https://jurify.app}"
          echo "Testing: $FRONTEND_URL"
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$FRONTEND_URL" || echo "000")
            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
              echo "✅ Frontend OK (HTTP $STATUS)"
              exit 0
            fi
            echo "⚠️ Attempt $i: HTTP $STATUS — retrying in 10s..."
            sleep 10
          done
          echo "❌ Frontend health check failed after 3 attempts"
          exit 1
        env:
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}

      - name: 🔍 Health check - Edge Functions
        run: |
          echo "🔍 Checking edge functions..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            "${{ secrets.VITE_SUPABASE_URL }}/functions/v1/health" || echo "000")
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "✅ Edge Functions OK (HTTP $STATUS)"
          else
            echo "❌ Edge Functions health check failed (HTTP $STATUS)"
            exit 1
          fi

      - name: 📊 Report deployment
        run: |
          FRONTEND_URL="${FRONTEND_URL:-https://jurify.app}"
          echo "✅ Deploy completed!"
          echo "🌐 Frontend: $FRONTEND_URL"
          echo "⚡ Edge Functions: Deployed"
          echo "🗄️ Migrations: Applied"
        env:
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}

  # ==========================================
  # JOB 5: NOTIFICATION
  # ==========================================
  notify:
    name: 📢 Notify Team
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-edge-functions, deploy-migrations, smoke-tests]
    if: always()

    steps:
      - name: 📢 Create deployment summary
        if: always()
        run: |
          echo "## 🚀 Deployment Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ needs.deploy-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Edge Functions | ${{ needs.deploy-edge-functions.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Migrations | ${{ needs.deploy-migrations.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke Tests | ${{ needs.smoke-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Author:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

      - name: 🚨 Fail if any deploy step failed
        if: contains(needs.*.result, 'failure')
        run: |
          echo "❌ One or more deployment steps failed. Check the summary above."
          exit 1
