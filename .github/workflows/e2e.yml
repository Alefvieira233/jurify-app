name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Run E2E tests
        run: |
          # Use shell parameter expansion to provide safe fallback E2E credentials when secrets are hidden (e.g. on forks)
          export E2E_TEST_EMAIL="${{ secrets.E2E_TEST_EMAIL }}"
          export E2E_TEST_EMAIL="${E2E_TEST_EMAIL:-test@jurify.com}"
          export E2E_TEST_PASSWORD="${{ secrets.E2E_TEST_PASSWORD }}"
          export E2E_TEST_PASSWORD="${E2E_TEST_PASSWORD:-TestPass123!}"
          npx playwright test --project=chromium
        env:
          E2E_BASE_URL: http://localhost:8080

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
