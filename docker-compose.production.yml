# =====================================================================
# JURIFY — Production Docker Compose
# =====================================================================
# Inclui: App (Nginx) — WhatsApp via Kapso API (serviço gerenciado)
#
# Uso:
#   docker compose -f docker-compose.production.yml up -d
#
# Pré-requisitos:
#   1. Copie .env.example → .env e preencha os valores
#   2. Build da imagem: docker compose -f docker-compose.production.yml build
# =====================================================================

services:
  # ─── Jurify Frontend ───────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile.production
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN}
        VITE_APP_VERSION: ${VITE_APP_VERSION:-1.0.0}
        VITE_ENCRYPTION_KEY: ${VITE_ENCRYPTION_KEY}
    ports:
      - "80:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - jurify-net

networks:
  jurify-net:
    driver: bridge
